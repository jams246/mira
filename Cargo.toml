[package]
name = "mira"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }

[profile.release]
strip = "debuginfo"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

